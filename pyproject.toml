[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-camera-ttc-estimation-reproducibility"
version = "0.1.0"
description = "Reproducibility package for the thesis Time-To-Collision (TTC) estimation with event-based cameras."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
]
post-v13 = [
  "lightgbm>=4.6",
  "scikit-learn>=1.4",
]
figures = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "Code" }

[tool.setuptools.packages.find]
where = ["Code"]
include = ["evttc*"]
